---
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U interview -d userdb
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: null
