[project]
name = "03-fastapi-feature"
version = "0.1.0"
description = "FastAPI feature exercise - user service with PostgreSQL"
requires-python = "~=3.14.0"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[tool.pytest]
ini_options.asyncio_mode = "auto"
